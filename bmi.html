
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #dbeafe, transparent 40%),
                radial-gradient(circle at bottom right, #c4b5fd, transparent 40%),
                #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .calculator-card {
            max-width: 460px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.10);
        }

        .icon-box {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: #e0f2fe;
            font-size: 30px;
        }

        .heading {
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -1px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            line-height: 1.7;
        }

        .form-label {
            font-size: 13px;
            font-weight: 700;
            color: #334155;
            margin-bottom: 9px;
        }

        .form-control {
            height: 52px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #f8fafc;
            padding: 12px 15px;
            font-size: 14px;
        }

        .form-control:focus {
            background: white;
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.12);
        }

        .calculate-btn {
            height: 52px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            font-weight: 700;
            transition: 0.3s ease;
        }

        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
            color: white;
        }

        #showData {
            display: block;
            min-height: 0;
            margin-bottom: 0;
            border-radius: 12px;
            font-weight: 600;
            text-align: center;
        }

        .info-box {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 15px;
            margin-top: 22px;
        }

        .info-box p {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 0;
            line-height: 1.7;
        }

        @media (max-width: 480px) {
            .calculator-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="calculator-card">

        <div class="text-center">

            <div class="icon-box">
                ⚖️
            </div>

            <h1 class="heading h2">BMI Calculator</h1>

            <p class="subtitle mt-2 mb-4">
                Calculate your Body Mass Index and understand
                your body's health category.
            </p>

        </div>

        <div class="mb-3">
            <label for="gethi" class="form-label">
                Weight <span class="text-secondary">(kg)</span>
            </label>

            <input
                class="form-control"
                id="gethi"
                type="number"
                min="1"
                step="any"
                placeholder="e.g. 65">
        </div>

        <div class="mb-4">
            <label for="getwi" class="form-label">
                Height <span class="text-secondary">(cm)</span>
            </label>

            <input
                class="form-control"
                id="getwi"
                type="number"
                min="1"
                step="any"
                placeholder="e.g. 175">
        </div>

        <button
            class="btn calculate-btn w-100"
            onclick="dataInput()">
            Calculate BMI →
        </button>

        <div class="mt-4">
            <p id="showData" role="status" aria-live="polite"></p>
        </div>

        <div class="info-box">
            <p>
                💡 <strong class="text-dark">Did you know?</strong>
                BMI is a simple screening measure based on
                your weight and height. It does not directly
                measure body fat or overall health.
            </p>
        </div>

        <p class="text-center text-secondary mt-4 mb-0"
            style="font-size: 11px;">
            MADE WITH CARE · BMI HEALTH TOOL
        </p>

    </main>

    <script src="bmi.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
